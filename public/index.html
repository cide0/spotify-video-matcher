<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spotify video matcher</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="styles.css" rel="stylesheet">
    <script src="jquery-1.10.1.min.js"></script>
    <script src="match-video.js" defer></script>
</head>

<body>
<div class="container">
    <div id="login">
        <a id="login-btn" href="/login" class="login-btn">Log in with Spotify</a>
    </div>
    <div id="loggedin" class="video-container">
        <p id="song_search_string" hidden></p>
        <iframe id="music-video" class="music-video" src="" allowscriptaccess="always" allowfullscreen></iframe>
        <button id="next-video-btn" class="next-video-btn" style="display: none;">Try Next Video</button>
    </div>
</div>
</body>
</html>
